<!doctype html>
<html lang="en">
  <head>
    <title>User Registration Form</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <form action="index.php" method="post" enctype="multipart/form-data">
      <label for="username">username:</label>
      <input
        type="text"
        id="username"
        placeholder="e.g kakak"
        minlength="8"
        maxlength="15"
        required
      />
      <label for="password">password:</label>
      <input
        type="password"
        id="password"
        placeholder="password"
        minlength="8"
        maxlength="15"
        required
      />
      <br />
      <label for="email">email:</label>
      <input
        type="email"
        id="email"
        placeholder="kakak@gmail.com"
        required
      /><br />
      <label for="phone">phone #:</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="+995-123-45-67-89"
        pattern="[0-9]{9}"
        inputmode="numeric"
        title="9 digits, e.g. 555123456"
        required
      />
      <br />
      <label for="bday">birthdate:</label>
      <input type="date" id="bday" name="bday" /><br />
      <label for="qty">Quantity:</label>
      <input
        type="number"
        id="qty"
        name="quantity"
        value="5"
        min="1"
        max="10"
        step="1"
      />
      <br />
      <label for="title">title:</label>

      <label for="mr">mr.</label>
      <input type="radio" id="mr" value="mr" name="title" />
      <label for="ms">ms.</label>
      <input type="radio" id="ms" value="ms" name="title" />
      <label for="dih">dih.</label>
      <input type="radio" id="dih" value="dih" name="title" /> <br />

      <label for="payment">payment</label>
      <select id="payment" name="payment">
        <option value="mastercard">mastercard</option>
        <option value="giftcard">giftcard</option>
      </select>
      <label for="comment">comment</label>
      <textarea id="comment" name="comment" rows="3" cols="25"></textarea>
      <br />
      <label for="file">file</label>
      <input
        type="file"
        id="file"
        name="file"
        accept="image/png, image/jpeg"
      /><br />
      <input type="reset" />
      <br />
      <input type="submit" />
    </form>
  </body>
</html>
