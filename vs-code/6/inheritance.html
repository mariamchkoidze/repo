<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HTML & CSS Inheritance Example</title>
    <link rel="stylesheet" href="inheritance.css" />
  </head>
  <body>
    <div class="parent-box">
      <h2>Parent Heading</h2>
      <p>
        This paragraph automatically inherits the blue text color and Arial font
        from the parent div.
      </p>

      <div class="forced-inherit">
        This child div inherits the text styles AND uses
        <code>border: inherit;</code> to copy the parent's border.
      </div>
    </div>
  </body>
</html>
