<!doctype html>
<html lang="en">
  <head>
    <title>Nesting Example</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="nestting.css" />
  </head>

  <body>
    <div>
      <p>inside div</p>
      <p>list in div</p>
      <ul>
        <li>jfhghghk</li>
        <li>jfhghghk</li>
        <li>jfhghghk</li>
      </ul>
    </div>
    <div>
      <p>outside div</p>
      <p>list out div</p>
      <ol>
        <li>fgjvhbklgh</li>
        <li>fgjvhbklgh</li>
        <li>fgjvhbklgh</li>
      </ol>
    </div>
  </body>
</html>
